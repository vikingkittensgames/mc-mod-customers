plugins {
    id 'customers-loader'
    id 'dev.architectury.loom'
    id 'com.github.johnrengelman.shadow'
    id 'com.diffplug.spotless'
}

def commonProject = project(':common')
def productionRunDirectory = rootProject.file("run-prod-fabric-${minecraft_version}")
def productionJavaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(java_version)
}

configurations {
    productionClientMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
        compileClasspath += commonProject.sourceSets.gameTest.output
        runtimeClasspath += commonProject.sourceSets.gameTest.output
    }
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'src/gameTest/java/**/*.java'
        importOrder(
                'java',
                '',
                'com.mojang|net.minecraft',
                'net.fabricmc',
                'com.vikingkittens',
                '\\#'
        )
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}

loom {
    silentMojangMappingsLicense()
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet commonProject.sourceSets.main
        }
        gameTest {
            sourceSet sourceSets.gameTest
            sourceSet commonProject.sourceSets.gameTest
        }
    }
    runs {
        client {
            client()
            runDir = "../run-fabric-${minecraft_version}"
        }
        server {
            server()
            runDir = "../run-fabric-${minecraft_version}"
            programArg '--nogui'
        }
        gameTest {
            server()
            runDir = "../run-fabric-${minecraft_version}"
            property 'fabric-api.gametest', 'true'
            source sourceSets.gameTest
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${architectury_version}"
    modCompileOnly "maven.modrinth:minecraft-comes-alive-reborn:${mca_version}"
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    modLocalRuntime "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    productionClientMods("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}") { transitive = false }
    productionClientMods("dev.architectury:architectury-fabric:${architectury_version}") { transitive = false }
    productionClientMods("software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}") {
        transitive = false
    }
    implementation project(path: ':common', configuration: 'namedElements')
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'namedElements')) { transitive = false }

}

tasks.named('processResources', ProcessResources) {
    inputs.properties([
        architectury_version  : architectury_version,
        fabric_api_version    : fabric_api_version,
        fabric_loader_version : fabric_loader_version,
        geckolib_version       : geckolib_version,
        minecraft_version     : minecraft_version,
        mod_id                : mod_id,
        mod_name              : mod_name,
        mod_version           : mod_version
    ])
    filesMatching('fabric.mod.json') {
        expand(inputs.properties)
    }
}

tasks.named('shadowJar', Jar) {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

tasks.named('remapJar') {
    dependsOn(tasks.named('shadowJar'))
    inputFile = tasks.named('shadowJar').flatMap { it.archiveFile }
}

tasks.register('prepareProdClient', Copy) {
    group = 'customers runs'
    description = 'Builds and copies production Fabric mods into the production run directory.'
    dependsOn(tasks.named('build'))
    into(new File(productionRunDirectory, 'mods'))
    from(tasks.named('remapJar').flatMap { it.archiveFile }) {
        rename { 'customers-under-test.jar' }
    }
    from(configurations.productionClientMods) {
        rename(/architectury-fabric-.+\.jar/, 'architectury-api-under-test.jar')
        rename(/fabric-api-.+\.jar/, 'fabric-api-under-test.jar')
        rename(/geckolib-fabric-.+\.jar/, 'geckolib-under-test.jar')
    }
}

tasks.register('runProdClient', Exec) {
    group = 'customers runs'
    description = 'Runs the packaged Customers Fabric mod in a production client.'
    dependsOn(rootProject.tasks.named('installPortableMc'), tasks.named('prepareProdClient'))

    doFirst {
        commandLine(
                rootProject.productionClientLauncher.get(),
                '--main-dir', rootProject.productionClientMainDirectory.asFile.absolutePath,
                'start', "fabric:${minecraft_version}:${fabric_loader_version}",
                '--mc-dir', productionRunDirectory.absolutePath,
                '--username', providers.gradleProperty('production_username').getOrElse('Dev'),
                '--jvm', productionJavaLauncher.get().executablePath.asFile.absolutePath)
    }
}
