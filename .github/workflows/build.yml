name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-all-loaders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify formatting and build both loaders
        run: ./gradlew --no-daemon clean spotlessCheck testAllLoaders runDataForge runDataNeoForge buildAllLoaders

      - name: Verify generated data is current
        run: git diff --check && git diff --exit-code -- forge/src/generated neoforge/src/generated

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: customers-forge
          path: forge/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: customers-neoforge
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
