plugins {
    id 'customers-loader'
    id 'dev.architectury.loom'
    id 'com.github.johnrengelman.shadow'
    id 'idea'
    id 'com.diffplug.spotless'
}

def neoForgeRunDirectory = "../run-neoforge-${minecraft_version}"
def productionRunDirectory = rootProject.file("run-prod-neoforge-${minecraft_version}")
def commonProject = project(':common')
def productionJavaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(java_version)
}

configurations {
    productionClientMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
        compileClasspath += commonProject.sourceSets.gameTest.output
        runtimeClasspath += commonProject.sourceSets.gameTest.output
    }
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

sourceSets.main.resources {
    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/*.kra") // Krita project files
    exclude("**/.cache/**") // datagen cache files
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'src/gameTest/java/**/*.java'
        importOrder(
                'java',
                '',
                'com.mojang|net.minecraft',
                'net.minecraftforge',
                'net.neoforged',
                'com.vikingkittens',
                '\\#'
        )
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}

loom {
    silentMojangMappingsLicense()

    mods {
        main {
            sourceSet sourceSets.main
            sourceSet commonProject.sourceSets.main
            sourceSet sourceSets.gameTest
            sourceSet commonProject.sourceSets.gameTest
        }
    }

    runs {
        client {
            client()
            name = 'NeoForge Client'
            runDir = neoForgeRunDirectory
            vmArg "-Dneoforge.enabledGameTestNamespaces=${mod_id}"
        }

        server {
            server()
            name = 'NeoForge Server'
            runDir = neoForgeRunDirectory
            programArg '--nogui'
            vmArg "-Dneoforge.enabledGameTestNamespaces=${mod_id}"
        }

        gameTest {
            server()
            name = 'NeoForge Game Tests'
            runDir = neoForgeRunDirectory
            property 'neoforge.enableGameTest', 'true'
            property 'neoforge.gameTestServer', 'true'
            vmArg "-Dneoforge.enabledGameTestNamespaces=${mod_id},minecraft"
            source sourceSets.gameTest
        }

    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    neoForge "net.neoforged:neoforge:${neo_version}"

    modCompileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    modLocalRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    productionClientMods("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
    modCompileOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    modLocalRuntime "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    modCompileOnly "maven.modrinth:minecraft-comes-alive-reborn:${mca_version}"
    testRuntimeOnly "maven.modrinth:minecraft-comes-alive-reborn:${mca_version}"
    modCompileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    modLocalRuntime "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    productionClientMods("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}") {
        transitive = false
    }

    common(project(path: ':common', configuration: 'namedElements')) {
        transitive = false
    }
    shadowBundle(project(path: ':common', configuration: 'namedElements')) {
        transitive = false
    }

    testImplementation project(':testsupport')
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            architectury_version_range: architectury_version_range,
            ftb_quests_version_range  : ftb_quests_version_range,
            mca_version_range      : mca_version_range,
            geckolib_version_range : geckolib_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.named('shadowJar', Jar) {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

tasks.named('remapJar') {
    dependsOn(tasks.named('shadowJar'))
    inputFile = tasks.named('shadowJar').flatMap { it.archiveFile }
}

tasks.register('prepareProdClient', Copy) {
    group = 'customers runs'
    description = 'Builds and copies production NeoForge mods into the production run directory.'
    dependsOn(tasks.named('build'))
    into(new File(productionRunDirectory, 'mods'))
    from(tasks.named('remapJar').flatMap { it.archiveFile }) {
        rename { 'customers-under-test.jar' }
    }
    from(configurations.productionClientMods) {
        rename(/architectury-neoforge-.+\.jar/, 'architectury-api-under-test.jar')
        rename(/geckolib-neoforge-.+\.jar/, 'geckolib-under-test.jar')
    }
}

tasks.register('runProdClient', Exec) {
    group = 'customers runs'
    description = 'Runs the packaged Customers NeoForge mod in a production client.'
    dependsOn(rootProject.tasks.named('installPortableMc'), tasks.named('prepareProdClient'))

    doFirst {
        commandLine(
                rootProject.productionClientLauncher.get(),
                '--main-dir', rootProject.productionClientMainDirectory.asFile.absolutePath,
                'start', "neoforge::${neo_version}",
                '--mc-dir', productionRunDirectory.absolutePath,
                '--username', providers.gradleProperty('production_username').getOrElse('Dev'),
                '--jvm', productionJavaLauncher.get().executablePath.asFile.absolutePath)
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
