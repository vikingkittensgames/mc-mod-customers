modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Viking Kittens"
description='''Customers adds configurable customer and supplier villagers.'''

[[mixins]]
config="customers.common.mixins.json"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
mandatory=true
versionRange="${architectury_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbquests"
mandatory=false
versionRange="${ftb_quests_version_range}"
ordering="AFTER"
side="BOTH"
