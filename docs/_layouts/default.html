<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/default.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
</head>
<body>
  <header class="customers-docs-header">
    <a class="customers-docs-title" href="{{ '/' | relative_url }}">Customers</a>
    <nav aria-label="Documentation sections">
      <a href="{{ '/customer-spawners.html' | relative_url }}">Spawners</a>
      <a href="{{ '/economy/' | relative_url }}">Economy</a>
      <a href="{{ '/counters/' | relative_url }}">Counters</a>
      <a href="{{ '/customers.html' | relative_url }}">Customers</a>
      <a href="{{ '/suppliers.html' | relative_url }}">Suppliers</a>
      <a href="{{ '/appearances/' | relative_url }}">Appearances</a>
      <a href="{{ '/gameplay.html' | relative_url }}">Gameplay</a>
      <a href="{{ '/advancements.html' | relative_url }}">Advancements</a>
      <a href="{{ '/automation.html' | relative_url }}">Automation</a>
      <a href="{{ '/configuration.html' | relative_url }}">Configuration</a>
      <a href="{{ '/development.html' | relative_url }}">Development</a>
    </nav>
  </header>
  <main class="customers-docs-content">
    {{ content }}
    {% if page.parent_url and page.parent_title %}
    <nav class="customers-docs-back" aria-label="Parent page">
      <a href="{{ page.parent_url | relative_url }}">&larr; Back to {{ page.parent_title }}</a>
    </nav>
    {% endif %}
  </main>
</body>
</html>
