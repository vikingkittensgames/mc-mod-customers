plugins {
    id 'base'
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'com.github.johnrengelman.shadow' version "${shadow_plugin_version}" apply false
    id 'com.diffplug.spotless' version '8.9.0' apply false
}

def portableMcDirectory = layout.projectDirectory.dir(".gradle/portablemc-launcher/${portablemc_version}")
def portableMcIsWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def portableMcExecutable = portableMcDirectory.file(portableMcIsWindows ? 'portablemc.exe' : 'portablemc')

tasks.register('installPortableMc') {
    group = 'customers runs'
    description = 'Downloads the pinned PortableMC production launcher.'
    inputs.property('portablemcVersion', portablemc_version)
    inputs.property('portablemcWindowsX86_64Sha256', portablemc_windows_x86_64_sha256)
    inputs.property('portablemcMacosAarch64Sha256', portablemc_macos_aarch64_sha256)
    inputs.property('portablemcMacosX86_64Sha256', portablemc_macos_x86_64_sha256)
    outputs.file(portableMcExecutable)

    onlyIf {
        !providers.gradleProperty('portablemc_executable').isPresent()
    }

    doLast {
        def operatingSystem = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        def architecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
        def portableMcPlatform
        if (operatingSystem.contains('windows') && architecture in ['amd64', 'x86_64']) {
            portableMcPlatform = [
                    archiveName   : "portablemc-${portablemc_version}-windows-x86_64-msvc.zip",
                    archiveIsZip  : true,
                    checksum      : portablemc_windows_x86_64_sha256,
                    executableName: 'portablemc.exe'
            ]
        } else if (operatingSystem.contains('mac') && architecture in ['aarch64', 'arm64']) {
            portableMcPlatform = [
                    archiveName   : "portablemc-${portablemc_version}-macos-aarch64.tar.gz",
                    archiveIsZip  : false,
                    checksum      : portablemc_macos_aarch64_sha256,
                    executableName: 'portablemc'
            ]
        } else if (operatingSystem.contains('mac') && architecture in ['amd64', 'x86_64']) {
            portableMcPlatform = [
                    archiveName   : "portablemc-${portablemc_version}-macos-x86_64.tar.gz",
                    archiveIsZip  : false,
                    checksum      : portablemc_macos_x86_64_sha256,
                    executableName: 'portablemc'
            ]
        } else {
            throw new GradleException(
                    'Automatic PortableMC installation supports Windows x86_64 and macOS aarch64/x86_64. ' +
                            'Set -Pportablemc_executable=/path/to/portablemc on another platform.')
        }

        def launcherDirectory = portableMcDirectory.asFile
        def archiveFile = new File(launcherDirectory, portableMcPlatform.archiveName)
        launcherDirectory.mkdirs()
        if (!archiveFile.exists()) {
            def download = new URI(
                    "https://github.com/theorzr/portablemc/releases/download/v${portablemc_version}/${archiveFile.name}")
                    .toURL()
            def temporaryArchive = new File(launcherDirectory, "${archiveFile.name}.part")
            download.withInputStream { input ->
                temporaryArchive.withOutputStream { output -> output << input }
            }
            java.nio.file.Files.move(
                    temporaryArchive.toPath(),
                    archiveFile.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archiveFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int count = input.read(buffer); count >= 0; count = input.read(buffer)) {
                digest.update(buffer, 0, count)
            }
        }
        def actualChecksum = digest.digest().encodeHex().toString()
        if (!actualChecksum.equalsIgnoreCase(portableMcPlatform.checksum)) {
            archiveFile.delete()
            throw new GradleException(
                    "PortableMC checksum mismatch: expected ${portableMcPlatform.checksum}, got ${actualChecksum}")
        }

        copy {
            from(portableMcPlatform.archiveIsZip
                    ? zipTree(archiveFile)
                    : tarTree(resources.gzip(archiveFile)))
            include "**/${portableMcPlatform.executableName}"
            eachFile { fileCopyDetails ->
                fileCopyDetails.path = portableMcPlatform.executableName
            }
            includeEmptyDirs = false
            into launcherDirectory
        }
        if (!portableMcIsWindows && !new File(launcherDirectory, portableMcPlatform.executableName).setExecutable(true)) {
            throw new GradleException('Unable to mark the PortableMC launcher as executable.')
        }
    }
}

ext.productionClientLauncher = providers.gradleProperty('portablemc_executable')
        .orElse(portableMcExecutable.asFile.absolutePath)
ext.productionClientMainDirectory = layout.projectDirectory.dir('.gradle/portablemc-runtime')

tasks.register('runClientNeoForge') {
    group = 'customers runs'
    description = 'Runs the Customers NeoForge client.'
    dependsOn(':neoforge:runClient')
}

tasks.register('runProdClientNeoForge') {
    group = 'customers runs'
    description = 'Builds and runs the Customers NeoForge production client.'
    dependsOn(':neoforge:runProdClient')
}

tasks.register('runServerNeoForge') {
    group = 'customers runs'
    description = 'Runs the Customers NeoForge server.'
    dependsOn(':neoforge:runServer')
}

tasks.register('runClientFabric') {
    group = 'customers runs'
    description = 'Runs the Customers Fabric client.'
    dependsOn(':fabric:runClient')
}

tasks.register('runProdClientFabric') {
    group = 'customers runs'
    description = 'Builds and runs the Customers Fabric production client.'
    dependsOn(':fabric:runProdClient')
}

tasks.register('runServerFabric') {
    group = 'customers runs'
    description = 'Runs the Customers Fabric server.'
    dependsOn(':fabric:runServer')
}

tasks.register('buildFabric') {
    group = 'build'
    description = 'Builds the Customers Fabric JAR.'
    dependsOn(':fabric:build')
}

tasks.register('buildNeoForge') {
    group = 'build'
    description = 'Builds the Customers NeoForge JAR.'
    dependsOn(':neoforge:build')
}

tasks.register('buildAllLoaders') {
    group = 'build'
    description = 'Builds the Customers Fabric and NeoForge JARs.'
    dependsOn('buildFabric', 'buildNeoForge')
}

tasks.register('testAllLoaders') {
    group = 'verification'
    description = 'Runs common, Fabric, and NeoForge tests.'
    dependsOn(':common:test', ':fabric:test', ':neoforge:test')
}
