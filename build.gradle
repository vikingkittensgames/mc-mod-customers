plugins {
    id 'base'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'com.diffplug.spotless' version '8.9.0' apply false
}

tasks.register('runClientNeoForge') {
    group = 'customers runs'
    description = 'Runs the Customers NeoForge client.'
    dependsOn(':neoforge:runClient')
}

tasks.register('runServerNeoForge') {
    group = 'customers runs'
    description = 'Runs the Customers NeoForge server.'
    dependsOn(':neoforge:runServer')
}

tasks.register('runDataNeoForge') {
    group = 'customers runs'
    description = 'Runs Customers data generation for NeoForge.'
    dependsOn(':neoforge:runData')
}

tasks.register('runClientForge') {
    group = 'customers runs'
    description = 'Runs the Customers Forge client.'
    dependsOn(':forge:runClient')
}

tasks.register('runServerForge') {
    group = 'customers runs'
    description = 'Runs the Customers Forge server.'
    dependsOn(':forge:runServer')
}

tasks.register('runDataForge') {
    group = 'customers runs'
    description = 'Runs Customers data generation for Forge.'
    dependsOn(':forge:runData')
}

tasks.register('buildNeoForge') {
    group = 'build'
    description = 'Builds the Customers NeoForge JAR.'
    dependsOn(':neoforge:build')
}

tasks.register('buildForge') {
    group = 'build'
    description = 'Builds the Customers Forge JAR.'
    dependsOn(':forge:build')
}

tasks.register('buildAllLoaders') {
    group = 'build'
    description = 'Builds the Customers Forge JAR for the 1.20.1 port.'
    dependsOn('buildForge')
}

tasks.register('testAllLoaders') {
    group = 'verification'
    description = 'Runs common and Forge tests for the 1.20.1 port.'
    dependsOn(':common:test', ':forge:test')
}
