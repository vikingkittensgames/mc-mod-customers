plugins {
    id 'customers-common'
    id 'dev.architectury.loom-no-remap'
    id 'com.diffplug.spotless'
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

sourceSets.main.resources {
    exclude('**/*.bbmodel')
    exclude('**/*.kra')
    exclude('src/generated/**/.cache')
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'src/gameTest/java/**/*.java'
        importOrder(
                'java',
                '',
                'com.mojang|net.minecraft',
                'net.minecraftforge',
                'net.neoforged',
                'com.vikingkittens',
                '\\#'
        )
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "dev.architectury:architectury:${architectury_version}"
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    testRuntimeOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    testRuntimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "maven.modrinth:geckolib:${geckolib_neoforge_artifact_version}"
    testRuntimeOnly "maven.modrinth:geckolib:${geckolib_neoforge_artifact_version}"
    testImplementation project(':testsupport')
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation "org.mockito:mockito-core:5.20.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
